[project]
name = "general-agent-template"
version = "0.1.0"
description = "Minimal CLI nanobot for learning agent core concepts"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent = "cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "bus", "cli", "cron", "heartbeat", "providers", "session"]
